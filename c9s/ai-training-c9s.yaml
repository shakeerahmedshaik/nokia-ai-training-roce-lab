---
apiVersion: v1
kind: Namespace
metadata:
    name: ai-training
    labels:
        pod-security.kubernetes.io/enforce: privileged
---
apiVersion: v1
kind: ConfigMap
metadata:
    name: ai-training-spine1-startup-config
    namespace: ai-training
data:
  startup-config: |-
    set / interface ethernet-1/1 admin-state enable
    set / interface ethernet-1/1 subinterface 0 ip-mtu 9000
    set / interface ethernet-1/1 subinterface 0 ipv4 admin-state enable
    set / interface ethernet-1/1 subinterface 0 ipv4 address 192.168.11.1/31
    set / interface ethernet-1/2 admin-state enable
    set / interface ethernet-1/2 subinterface 0 ip-mtu 9000
    set / interface ethernet-1/2 subinterface 0 ipv4 admin-state enable
    set / interface ethernet-1/2 subinterface 0 ipv4 address 192.168.21.1/31
    set / interface system0 admin-state enable
    set / interface system0 subinterface 0 ipv4 admin-state enable
    set / interface system0 subinterface 0 ipv4 address 10.0.0.1/32

    set / network-instance default interface ethernet-1/1.0
    set / network-instance default interface ethernet-1/2.0
    set / network-instance default interface system0.0

    set / routing-policy policy ACCEPT-ALL default-action policy-result accept

    set / network-instance default protocols bgp admin-state enable
    set / network-instance default protocols bgp autonomous-system 65100
    set / network-instance default protocols bgp router-id 10.0.0.1
    set / network-instance default protocols bgp afi-safi ipv4-unicast admin-state enable
    set / network-instance default protocols bgp afi-safi ipv4-unicast multipath ebgp maximum-paths 2
    set / network-instance default protocols bgp group leaves import-policy [ ACCEPT-ALL ]
    set / network-instance default protocols bgp group leaves export-policy [ ACCEPT-ALL ]
    set / network-instance default protocols bgp neighbor 192.168.11.0 peer-group leaves
    set / network-instance default protocols bgp neighbor 192.168.11.0 peer-as 65001
    set / network-instance default protocols bgp neighbor 192.168.21.0 peer-group leaves
    set / network-instance default protocols bgp neighbor 192.168.21.0 peer-as 65002

